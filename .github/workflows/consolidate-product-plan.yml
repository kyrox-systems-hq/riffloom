name: Consolidate product plan

on:
  push:
    branches:
      - agent/consolidate-product-plan
    paths:
      - .github/workflows/consolidate-product-plan.yml
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  consolidate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out consolidation branch
        uses: actions/checkout@v4
        with:
          ref: agent/consolidate-product-plan
          fetch-depth: 0

      - name: Consolidate and audit planning documents
        run: python scripts/consolidate_product_plan.py

      - name: Remove one-time files and commit result
        run: |
          rm scripts/consolidate_product_plan.py
          rm .github/workflows/consolidate-product-plan.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Consolidate Riffloom planning into one master document"
          git push origin HEAD:agent/consolidate-product-plan
