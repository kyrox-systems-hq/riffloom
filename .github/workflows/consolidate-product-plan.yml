name: Consolidate product plan

on:
  push:
    branches:
      - agent/consolidate-product-plan
    paths:
      - .github/workflows/consolidate-product-plan.yml

permissions:
  contents: write

jobs:
  consolidate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out consolidation branch
        uses: actions/checkout@v4
        with:
          ref: agent/consolidate-product-plan
          fetch-depth: 0

      - name: Build canonical product plan
        shell: bash
        run: |
          python - <<'PY'
          from __future__ import annotations

          import hashlib
          import re
          from pathlib import Path

          root = Path('.')
          docs = root / 'docs'

          sources = [
              ('Core product plan', docs / 'PRODUCT-PLAN.md'),
              ('Instrument family roadmap', docs / 'INSTRUMENT-ROADMAP.md'),
              ('AI music generation', docs / 'PRODUCT-PLAN-AI-GENERATION.md'),
              ('Connected ensemble sessions', docs / 'PRODUCT-PLAN-CONNECTED-SESSIONS.md'),
              ('Living notation and adaptive learning', docs / 'PRODUCT-PLAN-LIVING-NOTATION-AND-LEARNING.md'),
              ('Expanded opportunities', docs / 'PRODUCT-PLAN-EXPANDED-OPPORTUNITIES.md'),
              ('Technology stack research brief', docs / 'PRODUCT-PLAN-TECHNOLOGY-STACK-RESEARCH.md'),
          ]

          missing = [str(path) for _, path in sources if not path.exists()]
          if missing:
              raise SystemExit(f'Missing planning sources: {missing}')

          source_records = []
          for label, path in sources:
              text = path.read_text(encoding='utf-8').replace('\r\n', '\n').rstrip() + '\n'
              source_records.append({
                  'label': label,
                  'path': path,
                  'text': text,
                  'sha256': hashlib.sha256(text.encode('utf-8')).hexdigest(),
                  'lines': len(text.splitlines()),
                  'characters': len(text),
              })

          serial = 'RFL-PP-MASTER-260801-2050-01'
          header = f'''# Riffloom Master Product Plan

**Status:** Canonical living product plan  
**Version:** 1.0  
**Serial:** {serial}  
**Last consolidated:** 1 August 2026

## Purpose and document authority

This is the single canonical planning document for Riffloom. It consolidates the complete product vision, product principles, instrument roadmap, commercial model, structured music foundation, recording and mixing, remixing, artificial intelligence, connected sessions, notation and learning, accessibility, professional integration, expanded opportunity map and technology-stack research brief.

The consolidation deliberately preserves the complete contents of every source planning document. Repetition is retained where removing it could lose a qualification, constraint, example, priority or implementation detail. Future planning changes should be made in this file rather than creating another parallel product-plan document.

## Current product decisions

- Riffloom starts with phone-first, screen-native musical instruments but is intended to become a cross-platform musical creation, performance, learning, collaboration and professional-production system.
- The core project and official creation experience should remain free. Revenue should come primarily from production-ready exports and professional services that provide clear value beyond ordinary playback or recording.
- Structured music is foundational. Notes, timing, expression, instrument technique, recordings, arrangement, contributors, rights, AI provenance and versions should remain editable rather than being flattened prematurely into one audio file.
- Artificial intelligence should develop the user's musical intention rather than replace it by default. Human contributions must be lockable and AI results must remain editable and reversible.
- Musical notation should be a live, bidirectional view of the same underlying project used by instruments, playback, recording, teaching, collaboration and export.
- Falling-note or approaching-path guidance is not a defining Riffloom feature and should not shape the architecture. It remains an optional teaching aid to use only where evidence and user testing show that it improves learning. Priority belongs to living notation, instrument-native guidance, transcription, playback, feedback, adaptive practice and genuine score literacy.
- Local-network ensemble performance should be prioritised before making broad claims about unrestricted real-time internet jamming. Internet modes should adapt honestly to measured latency.
- No final production technology stack has been selected. It must be chosen through research and measured prototypes focused on multi-touch reliability, touch-to-sound latency, audio stability, rendering, networking and cross-platform requirements.

## Consolidated contents

1. Core product plan
2. Instrument family roadmap
3. AI music generation
4. Connected ensemble sessions
5. Living notation and adaptive learning
6. Expanded opportunities
7. Technology stack research brief

## Consolidation audit

The following source fingerprints record exactly what was consolidated before the old files were removed.

'''

          audit_lines = []
          for record in source_records:
              audit_lines.append(
                  f"- `{record['path'].as_posix()}`: {record['lines']} lines, "
                  f"{record['characters']} characters, SHA-256 `{record['sha256']}`"
              )

          parts = [header, '\n'.join(audit_lines) + '\n']

          for index, record in enumerate(source_records, start=1):
              parts.append('\n---\n\n')
              parts.append(f"## Part {index}: {record['label']}\n\n")
              if record['path'].name == 'PRODUCT-PLAN-LIVING-NOTATION-AND-LEARNING.md':
                  parts.append(
                      '> **Current priority decision:** The approaches described below are a broad option set, not a commitment to build every visual teaching method. Falling or approaching paths are optional and subordinate to living notation, direct instrument guidance, accurate performance feedback and progressive score reading.\n\n'
                  )
              parts.append(record['text'])

          master = ''.join(parts).rstrip() + '\n'

          omitted = []
          for record in source_records:
              for line_number, line in enumerate(record['text'].splitlines(), start=1):
                  if line.strip() and line not in master:
                      omitted.append(f"{record['path']}:{line_number}: {line}")
          if omitted:
              raise SystemExit('Consolidation omitted source lines:\n' + '\n'.join(omitted[:50]))

          (docs / 'PRODUCT-PLAN.md').write_text(master, encoding='utf-8')

          superseded = [path for _, path in sources if path.name != 'PRODUCT-PLAN.md']
          for path in superseded:
              path.unlink()

          replacements = {
              'docs/INSTRUMENT-ROADMAP.md': 'docs/PRODUCT-PLAN.md',
              'INSTRUMENT-ROADMAP.md': 'PRODUCT-PLAN.md',
              'PRODUCT-PLAN-AI-GENERATION.md': 'PRODUCT-PLAN.md',
              'PRODUCT-PLAN-CONNECTED-SESSIONS.md': 'PRODUCT-PLAN.md',
              'PRODUCT-PLAN-LIVING-NOTATION-AND-LEARNING.md': 'PRODUCT-PLAN.md',
              'PRODUCT-PLAN-EXPANDED-OPPORTUNITIES.md': 'PRODUCT-PLAN.md',
              'PRODUCT-PLAN-TECHNOLOGY-STACK-RESEARCH.md': 'PRODUCT-PLAN.md',
          }

          text_suffixes = {'.md', '.txt', '.html', '.js', '.mjs', '.css', '.json', '.yml', '.yaml'}
          for path in root.rglob('*'):
              if not path.is_file() or path.suffix.lower() not in text_suffixes:
                  continue
              if path == docs / 'PRODUCT-PLAN.md':
                  continue
              text = path.read_text(encoding='utf-8')
              updated = text
              for old, new in replacements.items():
                  updated = updated.replace(old, new)
              if updated != text:
                  path.write_text(updated, encoding='utf-8')

          readme = root / 'README.md'
          readme_text = readme.read_text(encoding='utf-8')
          planning_pattern = re.compile(
              r"## Product and instrument planning\n\n.*?(?=\n## Project files)",
              re.DOTALL,
          )
          planning_replacement = (
              '## Product planning\n\n'
              'The complete product vision, instrument-family roadmap, commercial model, AI direction, connected-session design, living notation and learning system, expanded opportunity map and technology-stack research brief are consolidated in [`docs/PRODUCT-PLAN.md`](docs/PRODUCT-PLAN.md). This is the single canonical planning document.\n'
          )
          readme_text, count = planning_pattern.subn(planning_replacement, readme_text)
          if count != 1:
              raise SystemExit(f'Expected one README planning section, replaced {count}')
          readme_text = readme_text.replace('│   ├── PRODUCT-PLAN.md\n│   ├── PRODUCT-PLAN.md\n', '│   ├── PRODUCT-PLAN.md\n')
          readme_text = readme_text.replace('│   ├── PRODUCT-PLAN.md\n│   └── instrument prototype specifications', '│   ├── PRODUCT-PLAN.md\n│   └── instrument prototype specifications')
          readme.write_text(readme_text, encoding='utf-8')

          for path in superseded:
              if path.exists():
                  raise SystemExit(f'Superseded file still exists: {path}')
          for record in source_records:
              if record['sha256'] not in master:
                  raise SystemExit(f"Missing audit fingerprint for {record['path']}")

          print(f'Created {docs / "PRODUCT-PLAN.md"} with {len(master.splitlines())} lines')
          print('Removed superseded planning files:')
          for path in superseded:
              print(f'  - {path}')
          PY

      - name: Remove one-time workflow and commit result
        shell: bash
        run: |
          rm .github/workflows/consolidate-product-plan.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Consolidate Riffloom planning into one master document"
          git push origin HEAD:agent/consolidate-product-plan
