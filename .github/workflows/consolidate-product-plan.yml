name: Consolidate product plan

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  consolidate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out consolidation branch
        uses: actions/checkout@v4
        with:
          ref: agent/consolidate-product-plan
          fetch-depth: 0

      - name: Consolidate and audit planning documents
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set +e
          python scripts/consolidate_product_plan.py > consolidation.log 2>&1
          status=$?
          cat consolidation.log
          {
            echo "### Consolidation audit run"
            echo
            echo '```text'
            cat consolidation.log
            echo '```'
            echo
            echo "Exit status: $status"
          } > consolidation-comment.md
          gh pr comment "$PR_NUMBER" --body-file consolidation-comment.md || true
          exit "$status"

      - name: Remove one-time files and commit result
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set +e
          rm scripts/consolidate_product_plan.py
          rm .github/workflows/consolidate-product-plan.yml
          rm -f consolidation.log consolidation-comment.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Consolidate Riffloom planning into one master document"
          commit_status=$?
          git push origin HEAD:agent/consolidate-product-plan
          push_status=$?
          if [ "$commit_status" -ne 0 ] || [ "$push_status" -ne 0 ]; then
            gh pr comment "$PR_NUMBER" --body "Consolidation content passed its audit, but the automated commit or push failed. Commit status: $commit_status. Push status: $push_status." || true
            exit 1
          fi
          gh pr comment "$PR_NUMBER" --body "Consolidation completed, audited and pushed. Temporary workflow and script were removed." || true
